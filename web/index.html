<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="シナリオ原稿と新旧の差分を、ブラウザ内で縦書きHTMLに組版します。">
    <title>Scenario — 縦書きシナリオ</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand"><h1>Scenario</h1><span>縦書きシナリオ</span></div>
    </header>
    <main class="workspace">
      <div class="workspace-controls">
      <div class="mode" role="group" aria-label="組版モード">
        <button type="button" data-mode="normal" aria-pressed="true">通常</button>
        <button type="button" data-mode="diff" aria-pressed="false">差分</button>
      </div>
      <div class="view-actions" role="group" aria-label="編集とプレビュー">
        <button id="back" aria-pressed="true" aria-controls="input-panel">原稿を編集</button>
        <button id="generate" aria-pressed="false" aria-controls="preview-panel">プレビューを表示</button>
        <button id="cancel" hidden>計算を中止</button>
      </div>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">原稿を入力して「プレビューを表示」を押してください。</p>
      <section id="input-panel" aria-labelledby="input-title">
        <div class="panel-header"><h2 id="input-title">原稿を入力</h2><button id="sample" class="quiet">サンプルを挿入</button></div>
        <p class="hint" id="source-help">シナリオのテキストを貼り付けてください。</p>
        <div id="normal-input" class="editors">
          <div class="editor"><label for="source">原稿</label><textarea id="source" spellcheck="false" aria-describedby="source-help" placeholder="☆ 作品タイトル&#10;★ 第一部&#10;■ シーン名&#10;＠ ト書き&#10;太郎「こんにちは」"></textarea></div>
        </div>
        <div id="diff-input" class="editors diff-editors" hidden>
          <div class="editor"><label for="before">旧原稿</label><textarea id="before" spellcheck="false" aria-describedby="source-help" placeholder="変更前の原稿を貼り付け"></textarea></div>
          <div class="editor"><label for="after">新原稿</label><textarea id="after" spellcheck="false" aria-describedby="source-help" placeholder="変更後の原稿を貼り付け"></textarea></div>
        </div>
        <details class="syntax"><summary>記法のヒント</summary><dl><dt>☆ 作品名</dt><dd>作品タイトル</dd><dt>★ 第一部</dt><dd>部タイトル</dd><dt>■ 場所・時間</dt><dd>シーン見出し</dd><dt>＠ 動作や情景</dt><dd>ト書き</dd><dt>太郎「台詞」</dt><dd>話者と台詞</dd><dt>＊</dt><dd>場面の区切り</dd></dl></details>
      </section>
      <section id="preview-panel" aria-labelledby="preview-title" hidden>
        <div class="panel-header preview-toolbar"><div class="preview-heading"><h2 id="preview-title" tabindex="-1">プレビュー</h2><span class="paper-label">縦書き · A4横</span></div></div>
        <div id="warnings" class="warnings" hidden></div>
        <div class="preview-body"><iframe id="preview" title="縦書き原稿のプレビュー" sandbox=""></iframe></div>
      </section>
      <div id="save-actions" class="actions save-actions"><button id="download-source" disabled>原稿を保存</button><button id="download" class="primary" hidden>HTMLを保存</button></div>
      <p class="privacy">原稿はこのブラウザ内で処理します。外部への送信・自動保存は行いません。閉じる前に原稿を手元に保存してください。</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
